<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f7" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230a66ff'/%3E%3Cpath d='M15 19h8l9 20 9-20h8L36 47h-8z' fill='white'/%3E%3C/svg%3E" />
    <title>鸿蒙智行 App 交互体验 Demo</title>
    <link rel="stylesheet" href="./reference.css" />
  </head>
  <body>
    <main class="demo-shell">
      <aside class="demo-guide" aria-label="演示说明">
        <p class="eyebrow">HIMA · HarmonyOS</p>
        <h1>鸿蒙智行<br />交互体验 Demo</h1>
        <p class="guide-copy">左右滑动切换顶部频道，上下滚动浏览内容；点击底部栏目体验完整页面与组件状态变化。</p>
        <div class="current-state" aria-live="polite">
          <span>当前页面</span>
          <strong id="pageTitle">发现 · 推荐</strong>
          <small id="pageStep">频道 1 / 4</small>
        </div>
        <div class="guide-actions">
          <button id="previousButton" type="button">上一频道</button>
          <button id="nextButton" type="button">下一频道</button>
        </div>
        <p class="key-hint">支持触摸、触控板、鼠标拖拽与方向键</p>
      </aside>

      <section class="phone-stage" aria-label="鸿蒙手机比例预览">
        <div id="phone" class="phone" tabindex="0">
          <div id="screen" class="screen" aria-live="polite"></div>
          <div id="toast" class="toast" role="status"></div>
        </div>
      </section>
    </main>
    <script src="./reference.js"></script>
  </body>
</html>
